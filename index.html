<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDK</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #080808;
    color: #ddd;
    font-family: monospace;
    overflow: hidden;
}

#game {
    width: 100vw;
    height: 100vh;
    position: relative;

    background:
        linear-gradient(rgba(0,0,0,.25), rgba(0,0,0,.65)),
        radial-gradient(circle at center, #303030 0%, #111 70%);
}

#room {
    position: absolute;
    inset: 0;
}

.object {
    position: absolute;
    cursor: pointer;
    transition: .15s;
}

.object:hover {
    filter: brightness(1.5);
    outline: 1px solid #777;
}


/* DOOR */

#door {
    width: 130px;
    height: 280px;
    background: #211813;
    border: 6px solid #0d0b0a;

    right: 12%;
    bottom: 15%;

    z-index: 2;
}

#doorknob {
    position: absolute;
    right: 15px;
    top: 50%;

    width: 14px;
    height: 14px;

    border-radius: 50%;
    background: #aaa;
}


/* DESK */

#desk {
    width: 300px;
    height: 80px;

    background: #35261d;
    border: 5px solid #17100c;

    left: 10%;
    bottom: 20%;

    z-index: 1;
}


/* KEY */

#key {
    position: absolute;

    left: 22%;
    bottom: 29%;

    font-size: 30px;

    display: none;

    cursor: pointer;

    z-index: 5;
}


/* GRABBER */

#grabber {
    position: absolute;

    left: 30%;
    bottom: 28%;

    font-size: 30px;

    display: none;

    cursor: pointer;

    z-index: 6;
}


/* COMPUTER */

#computer {
    width: 120px;
    height: 90px;

    background: #111;
    border: 7px solid #222;

    left: 25%;
    bottom: 29%;

    z-index: 2;
}

#computerScreen {
    width: 90px;
    height: 55px;

    margin: 10px auto;

    background: #172019;
    color: #4cff72;

    text-align: center;

    padding-top: 18px;

    font-size: 11px;
}


/* NOTE */

#note {
    width: 55px;
    height: 75px;

    background: #d6c99e;
    color: #111;

    left: 18%;
    bottom: 27%;

    padding: 8px;

    font-size: 9px;

    transform: rotate(-5deg);

    z-index: 3;
}


/* WINDOW */

#window {
    width: 180px;
    height: 150px;

    background: #070b12;
    border: 10px solid #30251d;

    left: 42%;
    top: 15%;

    z-index: 1;
}


/* DIALOGUE */

#dialogue {
    position: absolute;

    left: 5%;
    right: 5%;
    bottom: 90px;

    min-height: 80px;

    background: rgba(0,0,0,.9);
    border: 1px solid #555;

    padding: 18px;

    display: none;

    cursor: pointer;

    z-index: 10;
}

#dialogueText {
    line-height: 1.5;
}


/* INVENTORY */

#inventory {
    position: absolute;

    bottom: 0;
    left: 0;
    right: 0;

    height: 65px;

    background: #090909;

    border-top: 1px solid #444;

    display: flex;
    align-items: center;

    padding: 8px;

    gap: 8px;

    z-index: 20;
}

.item {
    width: 50px;
    height: 50px;

    border: 1px solid #444;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 11px;
}


/* ROOM NAME */

#roomName {
    position: absolute;

    top: 15px;
    left: 20px;

    color: #777;

    font-size: 13px;
}


/* FLASH */

#flash {
    position: fixed;

    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    z-index: 99;
}

.flash {
    animation: flash .3s;
}

@keyframes flash {

    0% {
        opacity: 0;
    }

    50% {
        opacity: .8;
    }

    100% {
        opacity: 0;
    }

}

</style>
</head>


<body>

<div id="game">

    <div id="room">

        <div id="roomName">
            ROOM 01 // BEDROOM
        </div>


        <!-- WINDOW -->

        <div
            id="window"
            class="object"
            onclick="inspectWindow()">
        </div>


        <!-- DESK -->

        <div
            id="desk"
            class="object"
            onclick="openDrawer()">
        </div>


        <!-- KEY -->

        <div
            id="key"
            class="object"
            onclick="takeKey()">

            🔑

        </div>


        <!-- GRABBER -->

        <div
            id="grabber"
            class="object"
            onclick="takeGrabber()">

            🪝

        </div>


        <!-- COMPUTER -->

        <div
            id="computer"
            class="object"
            onclick="inspectComputer()">

            <div id="computerScreen">
                NO SIGNAL
            </div>

        </div>


        <!-- NOTE -->

        <div
            id="note"
            class="object"
            onclick="readNote()">

            DON'T

        </div>


        <!-- DOOR -->

        <div
            id="door"
            class="object"
            onclick="openDoor()">

            <div id="doorknob"></div>

        </div>

    </div>


    <!-- DIALOGUE -->

    <div
        id="dialogue"
        onclick="closeDialogue()">

        <div id="dialogueText"></div>

    </div>


    <!-- INVENTORY -->

    <div id="inventory">

        <div class="item" id="item1">
            EMPTY
        </div>

        <div class="item" id="item2">
            EMPTY
        </div>

        <div class="item" id="item3">
            EMPTY
        </div>

        <div class="item" id="item4">
            EMPTY
        </div>

    </div>

</div>


<div id="flash"></div>


<script>

/* =========================
   GAME DATA
========================= */

let inventory =
    JSON.parse(localStorage.getItem("inventory")) || [];

let drawerOpen = false;

let keyTaken = false;

let doorOpened = false;

let computerBroken =
    localStorage.getItem("computerBroken") === "true";

let grabberTaken =
    localStorage.getItem("grabberTaken") === "true";


/* =========================
   DIALOGUE
========================= */

function say(text) {

    document.getElementById("dialogueText").innerText = text;

    document.getElementById("dialogue").style.display = "block";

}


function closeDialogue() {

    document.getElementById("dialogue").style.display = "none";

}


/* =========================
   INVENTORY
========================= */

function updateInventory() {

    const slots = document.querySelectorAll(".item");

    slots.forEach(function(slot, index) {

        if (inventory[index]) {

            slot.innerText = inventory[index];

        } else {

            slot.innerText = "EMPTY";

        }

    });

}


function addItem(item) {

    if (inventory.includes(item)) {
        return;
    }

    inventory.push(item);

    localStorage.setItem(
        "inventory",
        JSON.stringify(inventory)
    );

    updateInventory();

}


/* =========================
   NOTE
========================= */

function readNote() {

    say(
        "The paper is old.\n\n" +
        "Someone wrote this recently.\n\n" +
        "\"DO NOT OPEN THE DOOR.\""
    );

}


/* =========================
   COMPUTER
========================= */

function inspectComputer() {

    /* COMPUTER IS ALREADY BROKEN */

    if (computerBroken) {

        if (!grabberTaken) {

            document.getElementById("grabber").style.display =
                "block";

            say(
                "The screen is shattered.\n\n" +
                "Something is sticking out from behind it."
            );

            return;
        }

        say(
            "The computer is completely broken."
        );

        return;
    }


    /* FIRST CLICK */

    say(
        "The computer turns on by itself.\n\n" +
        "NO SIGNAL\n\n" +
        "Then a message appears:\n\n" +
        "HELLO, EVAN.\n\n" +
        "Something feels wrong about this computer."
    );


    /*
       IMPORTANT:
       This is the actual function assignment.
       No quotes!
    */

    document.getElementById("computer").onclick =
        smashComputer;

}


/* =========================
   SMASH COMPUTER
========================= */

function smashComputer() {

    computerBroken = true;

    localStorage.setItem(
        "computerBroken",
        "true"
    );


    /* CHANGE SCREEN */

    document.getElementById("computerScreen").innerText =
        "BROKEN";


    say(
        "You hit the screen.\n\n" +
        "CRACK.\n\n" +
        "The glass shatters.\n\n" +
        "Something falls behind the computer."
    );


    /* CHANGE COMPUTER BACK TO INSPECT */

    document.getElementById("computer").onclick =
        inspectComputer;


    /* SHOW GRABBER */

    document.getElementById("grabber").style.display =
        "block";

}


/* =========================
   TAKE GRABBER
========================= */

function takeGrabber() {

    if (grabberTaken) {
        return;
    }


    grabberTaken = true;


    localStorage.setItem(
        "grabberTaken",
        "true"
    );


    document.getElementById("grabber").style.display =
        "none";


    addItem("GRABBER");


    say(
        "You pull it free.\n\n" +
        "You found a GRABBER."
    );

}


/* =========================
   WINDOW
========================= */

function inspectWindow() {

    say(
        "You look outside.\n\n" +
        "There is nothing there.\n\n" +
        "You look again.\n\n" +
        "Something is standing in the distance."
    );

}


/* =========================
   DESK
========================= */

function openDrawer() {

    if (drawerOpen) {

        say(
            "The drawer is already open."
        );

        return;
    }


    drawerOpen = true;


    document.getElementById("key").style.display =
        "block";


    say(
        "You open the drawer.\n\n" +
        "There's a key inside."
    );

}


/* =========================
   KEY
========================= */

function takeKey() {

    if (keyTaken) {
        return;
    }


    keyTaken = true;


    document.getElementById("key").style.display =
        "none";


    addItem("KEY");


    say(
        "You picked up the key."
    );

}


/* =========================
   DOOR
========================= */

function openDoor() {

    if (doorOpened) {
        return;
    }


    if (!inventory.includes("KEY")) {

        say(
            "The door won't open.\n\n" +
            "It's locked."
        );

        return;
    }


    doorOpened = true;


    say(
        "The key fits.\n\n" +
        "The door slowly opens..."
    );


    setTimeout(function() {

        const door =
            document.getElementById("door");

        door.style.transform =
            "translateX(150px)";

        door.style.opacity =
            "0";

    }, 1000);


    setTimeout(function() {

        window.location.href =
            "room2.html";

    }, 2000);

}


/* =========================
   STARTUP
========================= */

updateInventory();


/* KEEP COMPUTER BROKEN */

if (computerBroken) {

    document.getElementById(
        "computerScreen"
    ).innerText = "BROKEN";

}


/* SHOW GRABBER IF COMPUTER
   IS BROKEN AND IT HASN'T
   BEEN TAKEN */

if (computerBroken && !grabberTaken) {

    document.getElementById(
        "grabber"
    ).style.display = "block";

}


/* HIDE GRABBER IF ALREADY TAKEN */

if (grabberTaken) {

    document.getElementById(
        "grabber"
    ).style.display = "none";

}

</script>

</body>
</html>
